[package]
name = "pcp_mmv"
version = "0.2.0"
authors = ["Saurav Sachidanand <sauravsachidanand@gmail.com>"]
edition = "2024"
rust-version = "1.85"
description = "Proof-of-concept Rust bindings to PCP's libpcp_mmv, with safe wrappers"
repository = "https://github.com/saurvs/pcp_mmv-rs"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["pcp", "mmv", "performance", "metrics", "instrumentation"]
categories = ["external-ffi-bindings"]
links = "pcp_mmv"
# Proof of concept: use https://crates.io/crates/hornet instead.
publish = false

[dependencies]
bitflags = "2"

[dev-dependencies]
rand = "0.10"

[target.'cfg(target_os = "linux")'.dev-dependencies]
inotify = "0.11"
